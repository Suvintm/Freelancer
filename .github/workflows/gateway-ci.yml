name: "API Gateway: Production CI"

on:
  push:
    branches: [main, master]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'api-gateway/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-lint-and-build:
    name: Nginx Validation & Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Nginx Configuration Syntax
        run: |
          echo "🔍 Validating nginx.conf syntax..."
          docker run --rm -v ${{ github.workspace }}/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.25-alpine nginx -t -c /etc/nginx/nginx.conf || true

      - name: Build API Gateway Docker Image
        run: |
          echo "🐳 Building API Gateway Docker container..."
          docker build -t suvix-api-gateway:ci ./api-gateway

      - name: Gateway Test Run & Healthcheck
        run: |
          echo "🚀 Testing container startup..."
          docker run -d --name test-gateway -p 8080:80 suvix-api-gateway:ci
          sleep 3
          curl -f http://localhost:8080/health || exit 1
          echo "✅ Gateway healthcheck passed!"
          docker rm -f test-gateway
