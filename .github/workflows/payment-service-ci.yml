name: "Payment Microservice: Production CI"

on:
  push:
    branches: [main, master]
    paths:
      - 'payment-service/**'
      - '.github/workflows/payment-service-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'payment-service/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-build-and-test:
    name: Java 21 Build & Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        working-directory: payment-service
        run: |
          mvn clean package -DskipTests -B

      - name: Build Payment Service Docker Image
        run: |
          echo "🐳 Building Payment Microservice Docker container..."
          docker build -t suvix-payment-service:ci ./payment-service
