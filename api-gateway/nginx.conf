# ============================================================
# SUVIX PLATFORM - PRODUCTION HARDENED API GATEWAY (STATIC)
# Nginx Reverse Proxy + Load Balancer + WAF + SSL Termination
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================
    # 1. DNS RESOLVER (Docker Embedded DNS First, Cloud Fallback)
    # ========================================================
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;

    # ========================================================
    # 2. ZERO-TRUST REAL CLIENT IP RESOLUTION (Cloudflare CIDRs)
    # ========================================================
    # Cloudflare IPv4 Blocks
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # Cloudflare IPv6 Blocks
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Internal Docker & Localhost Networks
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ========================================================
    # 3. OBSERVABILITY & STRUCTURED LOGGING
    # ========================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'ups=$upstream_addr rid="$request_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ========================================================
    # 4. GZIP COMPRESSION ENGINE
    # ========================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ========================================================
    # 5. ENTERPRISE SECURITY HEADERS
    # ========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ========================================================
    # 6. MULTI-TIER RATE LIMITING
    # ========================================================
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_payment:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_upload:10m rate=20r/m;
    limit_req_zone $http_x_user_id zone=api_user_auth:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    limit_req_status 429;
    limit_conn_status 429;

    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # Prevent duplicate CORS headers when upstream also emits CORS
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Max-Age;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # ========================================================
    # 7. UPSTREAM DEFINITIONS (Static / Local Docker)
    # ========================================================
    upstream node_core {
        server node-server-1:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream java_payments {
        server payment-service:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ========================================================
    # 8. MAP: CORS Dynamic Origin Validation
    # ========================================================
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://.*\.suvix\.in$"       $http_origin;
        "~^https?://suvix\.in$"          $http_origin;
        "~^https?://.*\.vercel\.app$"    $http_origin;
    }

    # ========================================================
    # 9. MAP: Bad Bot & Vulnerability Scanner Blocking
    # ========================================================
    map $http_user_agent $bad_bot {
        default 0;
        "~*sqlmap"          1;
        "~*nikto"           1;
        "~*wpscan"          1;
        "~*acunetix"        1;
        "~*masscan"         1;
        "~*zgrab"           1;
        "~*nmap"            1;
    }

    # ========================================================
    # SSL CERTIFICATES
    # ========================================================
    ssl_certificate /etc/ssl/gateway/cert.pem;
    ssl_certificate_key /etc/ssl/gateway/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ========================================================
    # MAIN API GATEWAY SERVER
    # ========================================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name api.suvix.in localhost _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        limit_conn addr 25;

        if ($bad_bot) {
            return 403 '{"error":"Forbidden by Security Policy","status":403}\n';
        }

        location ~* \.(env|git|svn|htaccess|ini|log|sh|sql|bak|yml|yaml)$ {
            return 444;
        }

        error_page 502 503 504 @service_fallback;

        location @service_fallback {
            return 503 '{"error":"Service temporarily unavailable. Our engineers are investigating.","status":503,"retry_after":30}\n';
            add_header Content-Type application/json always;
            add_header Retry-After 30 always;
        }

        location /health {
            access_log off;
            return 200 '{"status":"UP","service":"api-gateway","ssl":true}\n';
            add_header Content-Type application/json;
        }

        location /nginx-metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            stub_status on;
            access_log off;
        }

        # ====================================================
        # 1. PAYMENT MICROSERVICE -> JAVA SPRING BOOT (Port 8080)
        # ====================================================
        location ~ ^/api/v1/(payments|wallet|escrow|payouts|subscriptions)/ {
            limit_req zone=api_payment burst=30 nodelay;
            
            proxy_pass http://java_payments;
            proxy_http_version 1.1;
            
            # 🛡️ Service-to-Service Trusted Secret
            proxy_set_header X-Service-Secret "d7fddff0b3f4d37d6eb5675377526003d7e8dbe4eacaab3d5aec4567966ed543";

            # 🛡️ Idempotency Forwarding (Prevents Double Billing)
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Idempotency-Key $http_x_idempotency_key;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Dynamic CORS
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID, X-User-ID, Idempotency-Key, X-Idempotency-Key" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Max-Age 86400 always;
            add_header X-Request-ID $request_id always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ====================================================
        # 1b. PUBLIC CACHE: Public Profiles & Explore Feed (Micro-cached 10s)
        # Owner editing profile bypasses cache automatically with Authorization / no-cache
        # ====================================================
        location ~ ^/api/v1/(public-profile|explore)/ {
            limit_req zone=api_general burst=60 nodelay;

            proxy_cache api_cache;
            proxy_cache_valid 200 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # 🛡️ Dynamic Cache Bypass:
            # If the user is logged in (Authorization header) or sends Cache-Control: no-cache
            # (e.g. after updating their profile), bypass Nginx cache and fetch fresh from DB!
            proxy_cache_bypass $http_authorization $http_cache_control $http_pragma;
            proxy_no_cache     $http_authorization $http_cache_control $http_pragma;

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass http://node_core;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID, X-User-ID, Idempotency-Key" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header X-Request-ID $request_id always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ====================================================
        # 2. WEBSOCKET REALTIME -> NODE.JS (Socket.IO)
        # ====================================================
        location /socket.io/ {
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Dynamic CORS for polling transport
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID, X-User-ID" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header X-Request-ID $request_id always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ====================================================
        # 3. MEDIA STREAMING & UPLOADS -> NODE.JS (Zero-Buffer)
        # ====================================================
        location /api/v1/media/ {
            limit_req zone=api_upload burst=30 nodelay;
            client_max_body_size 500M;
            
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Dynamic CORS
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID, X-User-ID" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Max-Age 86400 always;
            add_header X-Request-ID $request_id always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ====================================================
        # 4. AUTH ROUTES -> NODE.JS (Brute Force Protected)
        # ====================================================
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=30 nodelay;
            
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Dynamic CORS
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header X-Request-ID $request_id always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ====================================================
        # 5. ALL OTHER API ROUTES -> NODE.JS CORE
        # ====================================================
        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID, X-User-ID" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header X-Request-ID $request_id always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location / {
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
