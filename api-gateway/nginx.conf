# ============================================================
# SUVIX PLATFORM - PRODUCTION API GATEWAY CONFIGURATION
# Nginx Reverse Proxy + Load Balancer + WAF + SSL Termination
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS Resolver (Public + Docker + Cloud DNS)
    resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=30s ipv6=off;

    # ========================================================
    # PERFORMANCE & STRUCTURED LOGGING
    # ========================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'ups=$upstream_addr rid="$request_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ========================================================
    # SECURITY HEADERS (Applied Globally)
    # ========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ========================================================
    # RATE LIMITING ZONES (Multi-Tier DDoS Shield)
    # ========================================================
    # General API: 100 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
    
    # Auth endpoints: 10 requests/minute per IP (prevents credential stuffing)
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    
    # Payment endpoints: 30 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_payment:10m rate=30r/m;
    
    # Upload endpoints: 20 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_upload:10m rate=20r/m;

    # Connection limiting: max 20 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Return standard HTTP 429 Too Many Requests on rate limit
    limit_req_status 429;
    limit_conn_status 429;

    # ========================================================
    # UPSTREAM DEFINITIONS (Active Backend Services)
    # ========================================================
    
    # Node.js Core Backend
    upstream node_core {
        server node-server-1:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # Java Payment Microservice (Spring Boot)
    upstream java_payments {
        server payment-service:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ========================================================
    # MAP: CORS Allowed Origins
    # ========================================================
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://.*\.suvix\.in$" $http_origin;
        "~^https?://suvix\.in$" $http_origin;
        "~^https?://.*\.vercel\.app$" $http_origin;
    }

    # ========================================================
    # SSL CERTIFICATE CONFIGURATION
    # ========================================================
    ssl_certificate /etc/ssl/gateway/cert.pem;
    ssl_certificate_key /etc/ssl/gateway/key.pem;

    # SSL Security Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ========================================================
    # MAIN API GATEWAY SERVER (HTTP + HTTPS)
    # ========================================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name api.suvix.in localhost _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Global connection limit
        limit_conn addr 20;

        # ====================================================
        # HEALTH CHECK
        # ====================================================
        location /health {
            access_log off;
            return 200 '{"status":"UP","service":"api-gateway","ssl":true}\n';
            add_header Content-Type application/json;
        }

        # ====================================================
        # NGINX INTERNAL METRICS
        # ====================================================
        location /nginx-metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            stub_status on;
            access_log off;
        }

        # ====================================================
        # 1. PAYMENT MICROSERVICE -> DIRECT TO JAVA (Spring Boot)
        # ====================================================
        location /api/v1/payments/ {
            limit_req zone=api_payment burst=10 nodelay;
            
            proxy_pass http://java_payments;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # CORS
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Max-Age 86400 always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }


        # ====================================================
        # 4. WEBSOCKET REALTIME -> NODE.JS (Socket.IO)
        # ====================================================
        location /socket.io/ {
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ====================================================
        # 5. MEDIA STREAMING & UPLOADS -> NODE.JS
        # ====================================================
        location /api/v1/media/ {
            limit_req zone=api_upload burst=5 nodelay;
            client_max_body_size 500M;
            
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ====================================================
        # 6. AUTH ROUTES -> NODE.JS (Brute Force Protected)
        # ====================================================
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ====================================================
        # 7. ALL OTHER API ROUTES -> NODE.JS CORE
        # ====================================================
        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ====================================================
        # 8. ROOT / STATIC FALLBACK -> NODE.JS CORE
        # ====================================================
        location / {
            proxy_pass http://node_core;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
